<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    IrisVector app icon: a Bézier curve with its anchor points and handles, as the Pen tool draws
    it, the same drawing the Iris Workspace shows (Iris/src/shared/types/workspace.types.ts, hue 88,
    light 0.82, drift -38). The gradient is its oklch(0.82 0.2 88) → oklch(0.76 0.21 50) in sRGB, so
    every renderer draws the same colours. The Workspace draws it on a 64 grid with the tile at
    4..60; here the tile fills the 512 canvas edge to edge (packaging/icons.sh adds Apple's margin
    for macOS). Every PNG, .ico and .icns in this folder is rendered from this file.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fab900"/>
      <stop offset="1" stop-color="#ff7e00"/>
    </linearGradient>
  </defs>
  <g transform="scale(9.142857) translate(-4 -4)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#g)"/>
    <path d="M15 46V27M49 18v19" stroke="#2b2200" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M15 46C15 27 49 37 49 18" fill="none" stroke="#2b2200" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="15" cy="27" r="2.6" fill="#fff" stroke="#2b2200" stroke-width="1.5"/>
    <circle cx="49" cy="37" r="2.6" fill="#fff" stroke="#2b2200" stroke-width="1.5"/>
    <rect x="11.5" y="42.5" width="7" height="7" rx="1.2" fill="#fff" stroke="#2b2200" stroke-width="1.8"/>
    <rect x="45.5" y="14.5" width="7" height="7" rx="1.2" fill="#fff" stroke="#2b2200" stroke-width="1.8"/>
    <rect x="29" y="29" width="6" height="6" rx="1" fill="#2b2200"/>
  </g>
</svg>
